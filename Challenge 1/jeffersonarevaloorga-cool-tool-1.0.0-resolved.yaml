        liked_at:
          type: string
          x-stoplight:
            id: 6663zn6u9be02
    LikeCreate:
      required:
      - inventory_id
      - liked_at
      - notify_stock
      - user_id
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        inventory_id:
          type: integer
          format: int64
        notify_stock:
          type: boolean
        liked_at:
          type: string
    Cart:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
          x-stoplight:
            id: ppj6lfm7o0rvy
        subtotal_amount:
          type: integer
          format: int64
          x-stoplight:
            id: gqnsgmgtrwr9d
        products:
          type: array
          x-stoplight:
            id: uxkq4dmupr0fc
          items:
            $ref: "#/components/schemas/CartItem"
    CartItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
        price:
          type: integer
          format: int64
          x-stoplight:
            id: tn2etm5lta7al
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
          x-stoplight:
            id: d465rx6trp5ox
        status:
          type: string
          x-stoplight:
            id: a7u4jhgp9u3sm
          enum:
          - Pending
          - Completed
          - Cancelled
        subtotal_amount:
          type: integer
          format: int64
          x-stoplight:
            id: 37aomt832ed2l
        total_amount:
          type: integer
          format: int64
          x-stoplight:
            id: oxf1939wbm0fl
        order_items:
          type: array
          x-stoplight:
            id: 1koqg35jagkhz
          items:
            $ref: "#/components/schemas/OrderItem"
        address_id:
          type: integer
          format: int64
          x-stoplight:
            id: 202jdi5sz8l9r
        payment_id:
          type: integer
          format: int64
          x-stoplight:
            id: ba0v88tnkb2o4
        order_date:
          type: string
          x-stoplight:
            id: i7mwwxskb5tt9
    OrderCreate:
      required:
      - address_id
      - order_items
      - payment_id
      - status
      - subtotal_amount
      - total_amount
      - user_id
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - Pending
          - Completed
          - Cancelled
        subtotal_amount:
          type: integer
          format: int64
        total_amount:
          type: integer
          format: int64
        order_items:
          type: array
          x-stoplight:
            id: b8p1m45kvtcz9
          items:
            $ref: "#/components/schemas/OrderItem"
        address_id:
          type: integer
          format: int64
        payment_id:
          type: integer
          format: int64
        order_date:
          type: string
      description: ""
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
        price:
          type: integer
          format: int64
    Payment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
          x-stoplight:
            id: nu3bhrfe0knso
        currency:
          type: string
          x-stoplight:
            id: ifiy4fck5vp74
        status:
          type: string
          x-stoplight:
            id: e1t41t3x6wf26
        stripe_id:
          type: string
          x-stoplight:
            id: l62z4phvk7r9p
      description: ""
    PaymentCreate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        stripe_id:
          type: string
    resetpassword_body:
      required:
      - newPassword
      - token
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
    cart_body:
      required:
      - product_id
      - quantity
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
  requestBodies:
    UserArray:
      description: List of user object
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/User"
      required: true
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: header
