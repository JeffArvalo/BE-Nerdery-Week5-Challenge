          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
          x-stoplight:
            id: cgige9uotpcwu
        main_image:
          type: boolean
          x-stoplight:
            id: o5qt0z3o7b3ht
        title:
          type: string
          x-stoplight:
            id: od2xqr0yn6rlq
        url:
          type: string
          x-stoplight:
