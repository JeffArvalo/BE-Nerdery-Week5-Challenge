        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        role_id:
          type: integer
          format: int64
        created_at:
          type: string
      description: ""
      xml:
        name: User
    UserLogin:
      title: UserLogin
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          x-stoplight:
            id: o1wwnilh6zzkq
    Product:
      title: Product
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          x-stoplight:
            id: fv8w31kn6jkge
        description:
          type: string
          x-stoplight:
            id: rzokhfcdn7em8
        specification:
          type: string
          x-stoplight:
            id: ze1zi1gutaiqw
        price:
          type: integer
          format: int64
          x-stoplight:
            id: rrbq68x8mw7zv
        stock:
          type: integer
          format: int64
          x-stoplight:
            id: v9s94mgak6q2d
        code:
          type: integer
          format: int64
          x-stoplight:
            id: v9498h3up8qed
        is_active:
          type: boolean
          x-stoplight:
            id: tc44k38wi9fvw
        vendor_id:
          type: integer
          format: int64
          x-stoplight:
            id: wl0liw8gufowj
        created_at:
          type: string
          x-stoplight:
            id: 2yr1504hz2sd0
    ProductCreate:
      title: Product
      required:
      - description
      - is_active
      - name
      - price
      - stock
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        specification:
          type: string
        price:
          type: integer
          format: int64
        stock:
          type: integer
          format: int64
        code:
          type: integer
          format: int64
        is_active:
          type: boolean
        vendor_id:
          type: integer
          format: int64
        created_at:
          type: string
    Image:
      type: object
      properties:
