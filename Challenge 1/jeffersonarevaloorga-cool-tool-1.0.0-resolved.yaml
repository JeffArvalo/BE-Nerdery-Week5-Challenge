openapi: 3.0.0
info:
  title: Cool Tool
  description: |
    This is a Swagger documentation about the proyect in the Ravn's Nerdery Program. The proyect consist in working developing an Hardware store. give us some mandatory features we have to follow and working with, also some extra feature

    Some useful links:
    - [Module 5 - REST](<https://ravn.getoutline.com/doc/module-5-rest-Cy0A4VMajP>)
  termsOfService: ""
  contact:
    name: Jeff Arevalo
    email: jeffersonarevalo@ravn.co
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
- url: https://virtserver.swaggerhub.com/jeffersonarevaloorga/cool-tool/1.0.0
  description: SwaggerHub API Auto Mocking
- url: https://cooltool.ravn.co/1.0.0
  description: Cool Tool
tags:
- name: authenticate
  description: Operations about users acounts
- name: product
  description: Operations about products
- name: order
  description: Operations about orders
- name: cart
  description: Operations about carts
- name: payment
  description: Operations about payments
paths:
  /signup:
    post:
      tags:
      - authenticate
      summary: Register a new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
        required: true
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNoPassword"
  /signin:
    post:
      tags:
      - authenticate
      summary: Logs user into the system
      operationId: loginUser
      parameters:
      - name: email
        in: query
        description: The email for login
        required: true
        schema:
          type: string
          format: email
      - name: password
        in: query
        description: The password for login in clear text
        required: true
        schema:
          type: string
          format: password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: successful operation
          headers:
            X-Rate-Limit:
              description: calls per hour allowed by the user
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: date in UTC when token expires
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNoPassword"
            application/xml:
              schema:
                type: string
        "400":
          description: Invalid username/password supplied
  /signout:
    get:
      tags:
      - authenticate
      summary: Logs out current logged in user session
      operationId: logoutUser
      responses:
        "200":
          description: successful operation
        "404":
          description: Not Found
      security:
      - api_key: []
  /forgot:
    post:
      tags:
      - authenticate
      summary: When user forgot password
      operationId: forgotPassword
      parameters:
      - name: email
        in: query
        description: The email for login
        required: true
        schema:
          type: string
          format: email
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: successful operation
          headers:
            X-Rate-Limit:
              description: calls per hour allowed by the user
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: date in UTC when token expires
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: string
            application/xml:
              schema:
                type: string
        "400":
          description: Invalid username/password supplied
  /reset-password:
    post:
      tags:
      - authenticate
      summary: Reset password using token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/resetpassword_body"
        required: true
      responses:
        "200":
          description: Password successfully changed
  /products:
    get:
      tags:
      - product
      summary: List products with pagination
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      tags:
      - product
      summary: Create a new product (Manager only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
        required: true
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/search:
    get:
      tags:
      - product
      summary: Search products by category
      parameters:
      - name: category
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: List of products in category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      tags:
      - product
      summary: Get product details by ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    put:
      tags:
      - product
      summary: Update a product (Manager only)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
        required: true
      responses:
        "200":
          description: Product updated
        "404":
          description: Product not found
    delete:
      tags:
      - product
      summary: Delete a product (Manager only)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Product deleted
  /products/{id}/images:
    post:
      tags:
      - product
      summary: Upload images for a product (Manager only)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        description: Created image
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageCreate"
        required: true
      responses:
        "201":
          description: Image created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
  /likes:
    get:
      tags:
      - product
      summary: List liked products by user
      responses:
        "200":
          description: List of liked products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Like"
    post:
      tags:
      - product
      summary: Like a product
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LikeCreate"
        required: true
      responses:
        "200":
          description: Product liked
  /cart:
    get:
      tags:
      - cart
      summary: Get current user's cart
      responses:
        "200":
          description: User cart details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    post:
      tags:
      - cart
      summary: Add product to cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cart_body"
        required: true
      responses:
        "200":
          description: Product added to cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /cart/{product_id}:
    delete:
      tags:
      - cart
      summary: Remove product from cart
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Product removed from cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /orders:
    get:
      tags:
      - order
      summary: Get orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      tags:
      - order
      summary: Create an order
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
        required: true
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}:
    get:
      tags:
      - order
      summary: Get order details by ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
  /stripe/create-session:
    post:
      tags:
      - payment
      summary: Create Stripe payment session for an order
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreate"
        required: true
      responses:
        "200":
          description: Stripe session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /stripe/webhook:
    post:
      tags:
      - payment
      summary: Stripe webhook to listen for payment status updates
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
components:
  schemas:
    User:
      title: UserAccount
      type: object
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        role_id:
          type: integer
          format: int64
        created_at:
          type: string
      xml:
        name: User
    UserCreate:
      title: UserCreate
      required:
      - email
      - first_name
      - last_name
      - password
      - role_id
      type: object
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        role_id:
          type: integer
          format: int64
          x-stoplight:
            id: 386n6b50wvgcy
        created_at:
          type: string
          x-stoplight:
            id: cpks9n2ucugxr
      xml:
        name: User
    UserNoPassword:
      title: UserNoPassword
      type: object
      properties:
